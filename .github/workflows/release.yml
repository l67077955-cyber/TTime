name: Release

# 构建 Windows 安装包并发布 Release，两种触发方式：
# 1. 推送 v* 标签（如 v0.9.3）
# 2. 在 Actions 页面手动运行，标签取 package.json 中的版本号（v<version>），不存在时自动创建
# 更新内容取自 .github/release-notes.md
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "name=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 旧版 node-gyp 依赖 distutils 需要 Python 3.11 及以下版本
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: |
          npm run modules-update
          npm run build

      - name: Package
        run: npx electron-builder --win --publish never

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: TTime ${{ steps.tag.outputs.name }}
          body_path: .github/release-notes.md
          files: |
            dist/*-setup.exe
            dist/*-setup.exe.blockmap
